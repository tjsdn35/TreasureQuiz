<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보물섬 퀴즈 탐험</title>
         <!-- 내부 스타일시트 -->
    <style>
        /* body 태그에 적용 */
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 24px;
            background: #f7f3e8;
        }

        /* 보물들을 모아놓은 공간 */
        .treasure-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .treasure {
            width: 200px;
            height: 150px;
            background: skyblue;
            border: 5px solid brown;
            border-radius: 18px;
            text-align: center;
            line-height: 150px;
            font-size: 22px;
        }

    </style>

</head>

<body>
    <h1>🏝️ 보물섬 퀴즈 탐험 🏝️</h1>
        <!-- Flexbox 감싸놓기-->
    <div class="treasure-row">
        <!-- 보물상자가 있는곳 -->
        <div class="treasure">💎 보석 💎</div>
        <div class="treasure">💰 황금 💰</div>
        <div class="treasure">🗺️ 보물지도 🗺️</div>

    </div>

</body>

</html>
