      <script>
         
         function notify(i) {
            // 동적 문자열 만들기

   <main class="quiz-grid">

      <button onclick="notify(0)"

   <!-- 보물상자들 중에 하나를 누르면 
            질문이 나타는 코드를 추가-->

   <section class="question-panel">
      
      <h2> 보물상자별 <strong>🔱 오늘의 퀴즈 🔱</strong> </h2>
      <!-- 문제를 보여줄 패널 p태그 -->
      <p id="question-text">보물상자를 선택해 문제를 시작하세요!</p>
   
   </section>
<!-- 여기 놔두어도 실행되는지 notify 실험 -->
    <script>
         
         function notify(i) {
            // 동적 문자열 만들기
            // 1. 동적 문자열은 무조건 `...`구성
            // 2. `안년하세요! {변수명}` =>
            // 3. "안녕하세요! 변수내용이 출력"
            // 4. {가변데이터} => 정적데이터로 생성
            // 5. " 변환된 정적 문자열 "
            // 6. 가변문자열은 `${변수명}입니다.` 형식
            let msg = `${i} 번쨰 버튼을 눌렸어요.`;
            alert(msg)
         }
         let say = notify; // 함수이름을 변수처럼 사용
         say (5);
  
      </script>

   <!-- 홈페이지 문서의 실행순서
    1. HTML 요소를 화면에 만든다
    2. CSS 스타일을 불러온다
    3. HTML 요소가 완전히 완성되어야 한다
    4. 자바스크립트가 실행된다. -->
   
    <script src="/js/game1.js"></script>
